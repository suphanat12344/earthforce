<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>ระบบตรวจจับการหลับตา</title>
  <style>
    body {
      background: #ffffff;
      color: #26047d;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    video, canvas {
      border: 1px solid #444;
      margin-top: 10px;
      width: 640px;
      height: auto;
    }
  </style>

  <!-- โหลด MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
</head>

<body>
  <h2>ระบบตรวจจับการหลับตา</h2>
  <p id="status">สถานะ: กรุณาคลิกที่หน้าเว็บเพื่อเปิดเสียง</p>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <audio id="alarm" src="alarm.mp3" preload="auto"></audio>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const alarm = document.getElementById("alarm");

    let soundEnabled = false;

    document.body.addEventListener("click", () => {
      alarm.play().then(() => {
        alarm.pause();
        alarm.currentTime = 0;
        soundEnabled = true;
        statusEl.innerText = "🔊 ระบบเสียงพร้อมใช้งานแล้ว (เริ่มตรวจจับได้)";
        console.log("เสียงอนุญาตแล้ว ✅");
      }).catch(err => {
        console.error("❌ ไม่สามารถเปิดเสียง:", err);
        statusEl.innerText = "⚠️ กรุณาคลิกที่หน้าเว็บเพื่อเปิดเสียง";
      });
    }, { once: true });

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await new Promise(r => (video.onloadedmetadata = r));
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        statusEl.innerText = "✅ กล้องพร้อมแล้ว (คลิกหน้าเว็บเพื่ออนุญาตเสียง)";
      } catch (err) {
        statusEl.innerText = "❌ เปิดกล้องไม่ได้: " + err.message;
      }
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6,
    });

    faceMesh.onResults(onResults);

    function euclidean(a, b) {
      return Math.sqrt(
        Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2)
      );
    }

    function getEAR(eye) {
      const A = euclidean(eye[1], eye[5]);
      const B = euclidean(eye[2], eye[4]);
      const C = euclidean(eye[0], eye[3]);
      return (A + B) / (2.0 * C);
    }

    let closedFrames = 0;
    const EAR_THRESHOLD = 0.18; // ถ้าต่ำกว่านี้ถือว่าหลับตา
    const FRAME_THRESHOLD = 50// ต้องหลับตาติดต่อกันกี่เฟรมถึงจะเตือน
    let lastAlarm = 0;

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYE, { color: "#00FF00", lineWidth: 1 });
        drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYE, { color: "#00FF00", lineWidth: 1 });

        const leftEyeIdx = [33, 160, 158, 133, 153, 144];
        const rightEyeIdx = [362, 385, 387, 263, 373, 380];
        const leftEye = leftEyeIdx.map(i => landmarks[i]);
        const rightEye = rightEyeIdx.map(i => landmarks[i]);

        const leftEAR = getEAR(leftEye);
        const rightEAR = getEAR(rightEye);
        const ear = (leftEAR + rightEAR) / 2.0;

        if (ear < EAR_THRESHOLD) {
          closedFrames++;
        } else {
          closedFrames = 0;
        }

        statusEl.innerText = `EAR: ${ear.toFixed(3)} | ปิดตา ${closedFrames} เฟรม`;

        if (closedFrames >= FRAME_THRESHOLD) {
          const now = Date.now();
          if (now - lastAlarm > 4000) {
            if (soundEnabled) {
              alarm.play().catch(e => console.warn("⚠️ ไม่สามารถเล่นเสียง:", e));
              console.log("🚨 ALARM Triggered!");
            } else {
              console.warn("⚠️ ต้องคลิกหน้าเว็บก่อนเพื่อเปิดเสียง");
            }
            lastAlarm = now;
            statusEl.innerText = "🚨 หลับตานาน! กำลังเตือน!";
          }
        }
      } else {
        statusEl.innerText = "⚠️ ไม่พบใบหน้า";
      }

      ctx.restore();
    }

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 640,
      height: 480,
    });

    startCamera().then(() => camera.start());
  </script>
</body>
</html>
